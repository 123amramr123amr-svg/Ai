<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<meta name="theme-color" content="#0b1020" />
<meta name="description" content="مساعد الذكاء الاصطناعي المتعدد: أضف مفاتيح API الخاصة بك، وتحدّث بالصوت والصورة والملفات، وشغّل الأكواد في صفحة Preview." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="مِشْكاة" />
<title>مِشْكاة — مساعدك الذكي بمفاتيحك الخاصة</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="app" class="app" data-view="chats">
  <div class="scrim" id="scrim" hidden></div>

  <!-- ============ Sidebar / drawer ============ -->
  <aside class="sidebar" id="sidebar" aria-label="التنقّل">
    <div class="brand">
      <img src="icons/icon.svg" alt="" class="brand-logo" />
      <div class="brand-text">
        <strong>مِشْكاة</strong>
        <span>مساعدك الذكي بمفاتيحك</span>
      </div>
      <button class="icon-btn sidebar-close" id="sidebarClose" title="إغلاق" aria-label="إغلاق القائمة">✕</button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">＋ محادثة جديدة</button>

    <nav class="nav">
      <button class="nav-item" data-goto="chats">📚 المكتبة</button>
      <button class="nav-item" data-goto="agents">🤖 الوكلاء (Agents)</button>
      <button class="nav-item" data-goto="usage">💰 الاستخدام والتكلفة</button>
      <button class="nav-item" data-goto="compare">⚖️ مقارنة النماذج</button>
      <button class="nav-item" data-goto="settings">⚙️ الإعدادات والمفاتيح</button>
      <button class="nav-item" data-goto="about">ℹ️ عن التطبيق</button>
    </nav>

    <div class="sidebar-search">
      <input type="search" id="convSearch" placeholder="ابحث في المكتبة…" />
    </div>
    <div class="conv-list" id="convList" role="list"></div>

    <div class="sidebar-foot">
      <span class="pill" id="storagePill">التخزين: محلي آمن على جهازك</span>
    </div>
  </aside>

  <!-- ============ Main ============ -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" title="القائمة" aria-label="القائمة">☰</button>
      <div class="topbar-title" id="topbarTitle">المحادثات</div>
      <div class="topbar-actions">
        <button class="icon-btn" id="exportBtn" title="تصدير كل البيانات">⬇️</button>
        <button class="icon-btn" id="themeBtn" title="الوضع الليلي/النهاري">🌓</button>
      </div>
    </header>

    <section class="view" id="view-chats">
      <div class="library-head">
        <h1>📚 مكتبتك</h1>
        <p>كل محادثاتك محفوظة هنا على جهازك — ابحث بالاسم أو بمحتوى الرسائل.</p>
        <div class="library-actions">
          <button class="btn primary" data-new-chat>＋ محادثة جديدة</button>
          <button class="btn" data-goto="agents">🤖 الوكلاء</button>
          <button class="btn" data-goto="settings">🔑 المفاتيح</button>
        </div>
      </div>
      <div class="library-tools">
        <input type="search" id="libSearch" placeholder="🔍 ابحث باسم المحادثة أو بكلمة في الرسائل…" />
        <div class="chips" id="libFilters">
          <button class="chip active" data-filter="all">الكل</button>
          <button class="chip" data-filter="chat">💬 محادثاتي</button>
          <button class="chip" data-filter="agent">🤖 الوكلاء</button>
        </div>
        <div class="library-count" id="libCount"></div>
      </div>
      <div class="lib-list" id="libList"></div>
      <div class="grid-cards" id="quickCards" style="margin-top:18px"></div>
    </section>

    <section class="view" id="view-chat" hidden>
      <div class="chat-head" id="chatHead"></div>
      <div class="messages" id="messages" aria-live="polite"></div>
      <div class="composer-wrap">
        <div class="attachments" id="attachments" hidden></div>
        <div class="attachments" id="toolLog" hidden></div>
        <div class="quick-chips" id="quickChips"></div>
        <form class="composer" id="composer">
          <button type="button" class="icon-btn" id="attachBtn" title="إرفاق ملفات">📎</button>
          <input type="file" id="fileInput" multiple hidden />
          <button type="button" class="icon-btn" id="recordBtn" title="تسجيل صوتي">🎤</button>
          <button type="button" class="icon-btn" id="cameraBtn" title="كاميرا / جاليري" hidden>📷</button>
          <input type="file" id="cameraInput" accept="image/*,video/*" capture="environment" hidden />
          <textarea id="input" rows="1" placeholder="اكتب رسالتك… (Shift+Enter لسطر جديد)"></textarea>
          <button type="submit" class="icon-btn send" id="sendBtn" title="إرسال">➤</button>
          <button type="button" class="icon-btn stop" id="stopBtn" title="إيقاف" hidden>■</button>
        </form>
        <div class="composer-hint" id="composerHint"></div>
      </div>
    </section>

    <section class="view" id="view-agents" hidden></section>
    <section class="view" id="view-usage" hidden></section>
    <section class="view" id="view-compare" hidden></section>
    <section class="view" id="view-settings" hidden></section>
    <section class="view" id="view-about" hidden></section>
  </main>
</div>

<!-- المعاينة المنبثقة (تفتح من علامة العين تحت أي كود) -->
<div id="pvOverlay" class="pv-overlay" hidden>
  <div class="pv-shell">
    <div class="pv-head">
      <button class="icon-btn" id="pvClose" title="إغلاق">✕</button>
      <strong id="pvTitle">معاينة الكود</strong>
      <span class="badge" id="pvLangBadge">—</span>
      <span class="spacer"></span>
      <button class="btn sm ok" id="pvRun">🔄 تشغيل</button>
      <button class="btn sm" id="pvStop">⏹</button>
      <button class="btn sm" id="pvCopy">📋 نسخ</button>
      <button class="btn sm" id="pvDl">⬇️ تنزيل</button>
      <button class="btn sm" id="pvFull">⛶ ملء</button>
    </div>
    <div class="pv-body" id="pvBody">
      <iframe id="pvFrame" class="pv-frame-main" title="معاينة الكود"></iframe>
      <div class="pv-side">
        <div class="pv-log" id="pvLog">سجل التشغيل سيظهر هنا…</div>
        <textarea class="pv-code" id="pvCodeEdit" spellcheck="false" title="يمكنك تعديل الكود وإعادة التشغيل"></textarea>
      </div>
    </div>
  </div>
</div>

<!-- شريط التنقّل السفلي (للموبايل) -->
<nav class="tabbar" id="tabbar">
  <div class="tabbar-inner">
    <button class="tab active" data-goto="chats"><span class="tab-ico">📚</span>المكتبة</button>
    <button class="tab" data-goto="chat"><span class="tab-ico">💬</span>محادثة</button>
    <button class="tab" data-goto="compare"><span class="tab-ico">⚖️</span>مقارنة</button>
    <button class="tab" data-goto="usage"><span class="tab-ico">💰</span>الاستخدام</button>
    <button class="tab" data-goto="settings"><span class="tab-ico">⚙️</span>الإعدادات</button>
  </div>
</nav>

<!-- شاشة القفل -->
<div class="lock-screen" id="lockScreen" hidden>
  <img class="lock-logo" src="icons/icon.svg" alt="مِشْكاة" />
  <div class="lock-title">مِشْكاة</div>
  <div class="lock-sub" id="lockSub">أدخل رمز الحماية للمتابعة</div>
  <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
  <div class="keypad" id="keypad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="del">⌫</button><button data-k="0">0</button><button data-k="ok">✓</button>
  </div>
  <div class="lock-err" id="lockErr"></div>
</div>

<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <div class="modal-head"><strong id="modalTitle">—</strong><button class="icon-btn" id="modalClose">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
